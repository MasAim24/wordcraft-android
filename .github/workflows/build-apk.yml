name: Build WordCraft Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      wordcraft_version:
        description: "WordCraft release version to package (e.g. 0.11.0)"
        required: false
        default: "0.11.0"

jobs:
  build:
    name: Build WordCraft Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: ☕ Setup Java 21 (Required for Capacitor 7 & AGP 8.4+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 🤖 Accept Pre-installed Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📦 Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: ⚡ Fetch WordCraft WebAssembly & Inject Mobile Bridge
        env:
          WORDCRAFT_VERSION: ${{ inputs.wordcraft_version || '0.11.0' }}
        run: pnpm build

      - name: 🔄 Init & Sync Capacitor Android
        run: |
          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android
          pnpm run setup:android

      - name: 🔨 Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 🚀 Upload WordCraft APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordCraft-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
